<section class="panel fx-rise rounded-[1.6rem] p-6 lg:p-7">
  <div class="section-kicker">Legal</div>
  <h1 class="mt-2 text-3xl font-semibold tracking-tight">{{page.heading}}</h1>
  <p class="mt-3 max-w-3xl text-sm muted">{{page.lead}}</p>
</section>

<section class="mt-6 grid gap-4 lg:grid-cols-3">
  {{#legal.sections}}
  <article class="panel fx-rise rounded-[1.35rem] p-5">
    <h2 class="text-lg font-semibold">{{title}}</h2>
    <p class="mt-2 text-sm muted">{{body}}</p>
  </article>
  {{/legal.sections}}
</section>
