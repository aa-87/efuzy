<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{page.title}}</title>
  <meta name="description" content="{{page.description}}">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="{{page.canonical}}">
  <meta property="og:type" content="{{page.ogType}}">
  <meta property="og:title" content="{{page.ogTitle}}">
  <meta property="og:description" content="{{page.ogDescription}}">
  <meta property="og:url" content="{{page.ogUrl}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{page.ogTitle}}">
  <meta name="twitter:description" content="{{page.ogDescription}}">
  {{{page.jsonld}}}
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          fontFamily: { sans: ['Inter','ui-sans-serif','system-ui','sans-serif'] },
          boxShadow: { glass: '0 18px 44px rgba(2,6,23,.22)' }
        }
      }
    };
  </script>
  <style>
    :root {
      --bg:#f4f7fb;
      --bg-soft:#ffffff;
      --panel:rgba(255,255,255,.90);
      --panel-soft:#ffffff;
      --border:rgba(15,23,42,.10);
      --text:#0f172a;
      --muted:#475569;
      --shadow:0 14px 40px rgba(15,23,42,.08);
      --accent:#0284c7;
    }
    html[data-theme="dark"] {
      --bg:#08111e;
      --bg-soft:#0d1728;
      --panel:rgba(8,16,30,.90);
      --panel-soft:rgba(11,21,37,.98);
      --border:rgba(148,163,184,.16);
      --text:#dbe7f5;
      --muted:#94a3b8;
      --shadow:0 18px 44px rgba(2,6,23,.34);
      --accent:#38bdf8;
    }
    body {
      background:
        radial-gradient(circle at top left, rgba(14,165,233,.08), transparent 24%),
        radial-gradient(circle at top right, rgba(99,102,241,.06), transparent 22%),
        var(--bg);
      color:var(--text);
    }
    .panel {
      background:var(--panel);
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      backdrop-filter:blur(16px);
    }
    .panel-soft { background:var(--panel-soft); border:1px solid var(--border); }
    .muted { color:var(--muted); }
    .section-kicker { letter-spacing:.16em; text-transform:uppercase; font-size:.68rem; color:var(--accent); font-weight:700; }
    .badge { display:inline-flex; align-items:center; gap:.45rem; padding:.35rem .72rem; border-radius:999px; font-size:.72rem; font-weight:700; border:1px solid transparent; line-height:1; }
    .badge::before { content:''; width:.45rem; height:.45rem; border-radius:999px; background:currentColor; opacity:.95; }
    .badge-sky{color:#7dd3fc;background:rgba(14,165,233,.12);border-color:rgba(14,165,233,.18)}
    .badge-emerald{color:#6ee7b7;background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.18)}
    .badge-violet{color:#c4b5fd;background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.18)}
    .tone-sky{background:linear-gradient(180deg, rgba(14,165,233,.12), rgba(14,165,233,.05)); border-color:rgba(14,165,233,.18)}
    .tone-emerald{background:linear-gradient(180deg, rgba(16,185,129,.14), rgba(16,185,129,.05)); border-color:rgba(16,185,129,.18)}
    .tone-amber{background:linear-gradient(180deg, rgba(245,158,11,.14), rgba(245,158,11,.05)); border-color:rgba(245,158,11,.18)}
    .tone-violet{background:linear-gradient(180deg, rgba(139,92,246,.14), rgba(139,92,246,.05)); border-color:rgba(139,92,246,.18)}
    .nav-link { display:inline-flex; align-items:center; gap:.55rem; border-radius:999px; border:1px solid transparent; padding:.7rem .95rem; color:var(--muted); transition:all .16s ease; }
    .nav-link:hover { background:rgba(148,163,184,.08); color:var(--text); }
    .nav-link.active { background:rgba(14,165,233,.10); color:#7dd3fc; border-color:rgba(14,165,233,.18); }
    html[data-theme="light"] .nav-link.active { color:#075985; }
    .quick-button, .ghost-button { border-radius:.95rem; border:1px solid var(--border); padding:.75rem .98rem; font-size:.84rem; font-weight:600; background:rgba(148,163,184,.06); }
    .quick-button:hover, .ghost-button:hover { background:rgba(148,163,184,.11); }
    .primary-button { border-radius:.95rem; padding:.82rem 1.05rem; font-size:.86rem; font-weight:700; color:#03131f; background:linear-gradient(180deg, #67e8f9, #38bdf8); border:1px solid rgba(56,189,248,.30); }
    .primary-button:hover { filter:brightness(1.03); }
    .field,.textarea,.select { width:100%; border-radius:.95rem; border:1px solid var(--border); background:rgba(2,6,23,.16); color:var(--text); padding:.85rem .95rem; font-size:.87rem; }
    html[data-theme="light"] .field, html[data-theme="light"] .textarea, html[data-theme="light"] .select { background:rgba(255,255,255,.78); }
    .field::placeholder,.textarea::placeholder { color:var(--muted); }
    .fx-rise { opacity:0; transform:translateY(16px); transition:opacity .45s ease, transform .45s ease; }
    .fx-rise.is-visible { opacity:1; transform:none; }
  </style>
</head>
<body class="font-sans antialiased">
  <header class="px-4 py-4 lg:px-6 lg:py-5">
    <div class="panel mx-auto flex max-w-7xl items-center justify-between rounded-[1.35rem] px-4 py-3 lg:px-5">
      <div>
        <div class="section-kicker">{{shell.eyebrow}}</div>
        <a href="/" class="mt-1 block text-xl font-semibold tracking-tight">{{app.name}}</a>
        <div class="mt-1 text-sm muted">{{app.tagline}}</div>
      </div>
      <div class="hidden items-center gap-2 lg:flex">
        {{#nav}}
        <a href="{{href}}" class="nav-link {{#isActive}}active{{/isActive}}">{{label}}</a>
        {{/nav}}
        <button type="button" id="themeToggle" class="quick-button">{{theme.toggleLabel}}</button>
      </div>
      <div class="flex items-center gap-2 lg:hidden">
        <a href="/contact" class="quick-button">Contact</a>
        <button type="button" id="themeToggleMobile" class="quick-button">Theme</button>
      </div>
    </div>
  </header>
  <main class="px-4 pb-10 lg:px-6 lg:pb-14">
    <div class="mx-auto max-w-7xl">{{{content}}}</div>
  </main>
  <footer class="px-4 pb-6 lg:px-6 lg:pb-8">
    <div class="panel mx-auto flex max-w-7xl flex-col gap-4 rounded-[1.35rem] px-4 py-4 lg:flex-row lg:items-center lg:justify-between lg:px-5">
      <div>
        <div class="text-sm font-semibold">{{app.name}}</div>
        <div class="mt-1 text-sm muted">{{app.tagline}}</div>
      </div>
      <div class="flex flex-wrap gap-2">
        {{#footer.links}}
        <a href="{{href}}" class="nav-link">{{label}}</a>
        {{/footer.links}}
      </div>
      <div class="text-sm muted">© {{site.year}} {{app.name}}</div>
    </div>
  </footer>
  <script>
    (function () {
      var root = document.documentElement;
      var key = 'efuzy-theme';
      function setTheme(mode) { root.setAttribute('data-theme', mode); try { localStorage.setItem(key, mode); } catch (e) {} }
      var saved = null;
      try { saved = localStorage.getItem(key); } catch (e) {}
      if (!saved) saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      setTheme(saved);
      function toggle() { setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); }
      var btn = document.getElementById('themeToggle'); if (btn) btn.addEventListener('click', toggle);
      var btn2 = document.getElementById('themeToggleMobile'); if (btn2) btn2.addEventListener('click', toggle);
      var items = document.querySelectorAll('.fx-rise');
      if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function(entries){
          entries.forEach(function(entry){ if (entry.isIntersecting) entry.target.classList.add('is-visible'); });
        }, { threshold: 0.12 });
        items.forEach(function(el){ io.observe(el); });
      } else {
        items.forEach(function(el){ el.classList.add('is-visible'); });
      }
    }());
  </script>
</body>
</html>
